name: Keep Supabase Active

on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read one exercise catalog ID
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          # Validate without printing secrets; reject elevated keys before any request.
          python3 - <<'PY'
          import os, json, base64
          from urllib.parse import urlparse
          url = urlparse(os.environ["SUPABASE_URL"])
          key = os.environ["SUPABASE_ANON_KEY"]
          if url.scheme != "https" or not url.hostname or url.username or url.password or url.query or url.fragment or url.path not in ("", "/"):
              raise SystemExit("Set SUPABASE_URL to the HTTPS project URL.")
          if not key or any(c.isspace() for c in key):
              raise SystemExit("Set SUPABASE_ANON_KEY to an anon or publishable key.")
          if not key.startswith("sb_publishable_"):
              try:
                  parts = key.split(".")
                  payload = json.loads(base64.urlsafe_b64decode(parts[1] + "=" * (-len(parts[1]) % 4)))
                  assert len(parts) == 3 and payload.get("role") == "anon"
              except Exception:
                  raise SystemExit("Only anon or publishable keys are allowed; never use service_role.")
          PY
          headers=(-H "apikey: $SUPABASE_ANON_KEY")
          # Publishable keys are not JWTs; only legacy anon JWTs use Bearer.
          if [[ "$SUPABASE_ANON_KEY" != sb_publishable_* ]]; then
            headers+=(-H "Authorization: Bearer $SUPABASE_ANON_KEY")
          fi
          status=$(curl --silent --show-error --fail \
            --connect-timeout 10 --max-time 30 \
            --retry 3 --retry-delay 5 --retry-max-time 120 \
            --output /dev/null --write-out '%{http_code}' \
            "${headers[@]}" \
            "${SUPABASE_URL%/}/rest/v1/exercise_catalog?select=id&limit=1")
          [[ "$status" == 200 ]] || { echo "Unexpected HTTP status: $status"; exit 1; }
          echo "Supabase database read succeeded."
