<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shift sign in screen</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&display=swap">
<style>
body{margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:#F2A41E}a:hover{color:#E6D9A8}
</style>
<style>body{background:#0E0E0F}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0E0F; color: #E6D9A8; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column; padding: 72px 20px 32px; gap: 28px">
<div style="display: flex; flex-direction: column; align-items: flex-start; gap: 18px">
<svg width="72" height="83" viewBox="0 0 108 124" role="img" aria-label="Shift crest">
<path d="M6 6h96v62c0 26-20 42-48 50C26 110 6 94 6 68z" fill="#1A1A1C" stroke="#E6D9A8" stroke-width="6" stroke-linejoin="round"></path>
<rect x="9" y="34" width="90" height="7" fill="#B81C28"></rect>
<rect x="9" y="47" width="90" height="17" fill="#E6D9A8"></rect>
<rect x="9" y="70" width="90" height="7" fill="#B81C28"></rect>
</svg>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 112px; line-height: 0.82; letter-spacing: 1px">SHIFT</div>
<div style="font-size: 16px; color: #A8A39A">Lifting and recovery built around game nights.</div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 12px">
<button style="border: 0; background: #B81C28; color: #E6D9A8; font-weight: 700; font-size: 18px; min-height: 56px; border-radius: 14px; display: flex; align-items: center; justify-content: center; gap: 10px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M9 9v1.5M15 9v1.5M12 9v4h-1M9.5 16c1.5 1 3.5 1 5 0"></path></svg>Sign in with Face ID</button>
<div style="display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 12px; font-size: 13px; color: #A8A39A; padding: 4px 0"><span style="height: 1px; background: #343436"></span>or use email<span style="height: 1px; background: #343436"></span></div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #A8A39A">Email<input type="email" autocomplete="username" value="" placeholder="you@example.com" style="box-sizing: border-box; width: 100%; height: 52px; border-radius: 14px; border: 1px solid #6B6860; background: #1A1A1C; color: #E6D9A8; padding: 0 14px; font-size: 17px"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #A8A39A">Password<input type="password" autocomplete="current-password" value="" style="box-sizing: border-box; width: 100%; height: 52px; border-radius: 14px; border: 1px solid #6B6860; background: #1A1A1C; color: #E6D9A8; padding: 0 14px; font-size: 17px"></label>
<button style="border: 1px solid #6B6860; background: transparent; font-weight: 700; font-size: 17px; min-height: 52px; border-radius: 14px">Sign in</button>
</div>
<div style="flex: 1"></div>
<div style="display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: #A8A39A"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A8A39A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><path d="M7 18a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 9.5a4.25 4.25 0 0 1-.5 8.5z"></path></svg><span>Workouts save on this phone first and sync to the cloud once you're signed in.</span></div>
</div>
</body>
</html>
