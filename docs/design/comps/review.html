<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shift review workout screen</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&display=swap">
<style>
body{margin:0}
button,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:#F2A41E}a:hover{color:#E6D9A8}
</style>
<style>body{background:#0E0E0F}</style>
</head>
<body>
<div style="width: 390px; height: 1440px; box-sizing: border-box; background: #0E0E0F; color: #E6D9A8; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column; gap: 12px; padding: 20px 16px 24px">
<div style="display: flex; flex-direction: column; gap: 4px; padding: 0 4px">
<div style="font-size: 13px; color: #A8A39A">Mon Nov 9, Chest Strength + Rear Delts</div>
<div style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 40px; line-height: 1; letter-spacing: 0.5px; text-transform: uppercase">Review your shift</div>
<div style="font-size: 15px; color: #A8A39A">Tap any set to fix it. Nothing is final until you save.</div>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; background: #1A1A1C; border: 1px solid #343436; border-radius: 16px; padding: 12px 16px">
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 32px; line-height: 1; letter-spacing: 0.5px">70:56</div>
<div style="font-size: 13px; color: #A8A39A">1:19 PM to 2:30 PM</div>
</div>
<button style="border: 1px solid #343436; background: transparent; font-weight: 600; font-size: 15px; min-height: 44px; padding: 0 16px; border-radius: 12px">Fix time</button>
</div>
<div style="background: #1A1A1C; border: 1px solid #343436; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: baseline; justify-content: space-between"><div style="font-weight: 700; font-size: 17px">Barbell Bench Press</div><div style="font-size: 13px; color: #A8A39A">3 warm-ups</div></div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<button aria-label="Set 1: 180 pounds for 5, Good" style="border: 1px solid #343436; background: #0E0E0F; border-radius: 12px; min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><span style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 700; font-size: 22px; line-height: 1">180 × 5</span><span style="font-size: 12px; color: #A8A39A">Good</span></button>
<button aria-label="Set 2: 180 pounds for 5, Good" style="border: 1px solid #343436; background: #0E0E0F; border-radius: 12px; min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><span style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 700; font-size: 22px; line-height: 1">180 × 5</span><span style="font-size: 12px; color: #A8A39A">Good</span></button>
<button aria-label="Set 3: 180 pounds for 5, Good" style="border: 1px solid #343436; background: #0E0E0F; border-radius: 12px; min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><span style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 700; font-size: 22px; line-height: 1">180 × 5</span><span style="font-size: 12px; color: #A8A39A">Good</span></button>
</div>
</div>
<div style="background: #1A1A1C; border: 1px solid #343436; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
<div style="font-weight: 700; font-size: 17px">Chest-Supported DB Row</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<button aria-label="Set 1: 50 pounds for 10, Good" style="border: 1px solid #343436; background: #0E0E0F; border-radius: 12px; min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><span style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 700; font-size: 22px; line-height: 1">50 × 10</span><span style="font-size: 12px; color: #A8A39A">Good</span></button>
<button aria-label="Set 2: 50 pounds for 10, Good" style="border: 1px solid #343436; background: #0E0E0F; border-radius: 12px; min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><span style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 700; font-size: 22px; line-height: 1">50 × 10</span><span style="font-size: 12px; color: #A8A39A">Good</span></button>
<button aria-label="Set 3: 50 pounds for 10, Good" style="border: 1px solid #343436; background: #0E0E0F; border-radius: 12px; min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><span style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 700; font-size: 22px; line-height: 1">50 × 10</span><span style="font-size: 12px; color: #A8A39A">Good</span></button>
</div>
</div>
<div style="background: #1A1A1C; border: 1px solid #343436; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
<div style="font-weight: 700; font-size: 17px">Incline DB Bench</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<button aria-label="Set 1: 55 pounds for 10, Good" style="border: 1px solid #343436; background: #0E0E0F; border-radius: 12px; min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><span style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 700; font-size: 22px; line-height: 1">55 × 10</span><span style="font-size: 12px; color: #A8A39A">Good</span></button>
<button aria-label="Set 2: 55 pounds for 9, Good" style="border: 1px solid #343436; background: #0E0E0F; border-radius: 12px; min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><span style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 700; font-size: 22px; line-height: 1">55 × 9</span><span style="font-size: 12px; color: #A8A39A">Good</span></button>
<button aria-label="Set 3: 55 pounds for 8, Hard" style="border: 1px solid #F2A41E; background: #0E0E0F; border-radius: 12px; min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><span style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 700; font-size: 22px; line-height: 1">55 × 8</span><span style="font-size: 12px; font-weight: 700; color: #F2A41E">Hard</span></button>
</div>
</div>
<div style="background: #1A1A1C; border: 1px solid #343436; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
<div style="font-weight: 700; font-size: 17px">Seated Bent-Over Rear-Delt Fly</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<button aria-label="Set 1: 15 pounds for 12, Good" style="border: 1px solid #343436; background: #0E0E0F; border-radius: 12px; min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><span style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 700; font-size: 22px; line-height: 1">15 × 12</span><span style="font-size: 12px; color: #A8A39A">Good</span></button>
<button aria-label="Set 2: 10 pounds for 15, Good" style="border: 1px solid #343436; background: #0E0E0F; border-radius: 12px; min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><span style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 700; font-size: 22px; line-height: 1">10 × 15</span><span style="font-size: 12px; color: #A8A39A">Good</span></button>
<button aria-label="Set 3: 10 pounds for 15, Good" style="border: 1px solid #343436; background: #0E0E0F; border-radius: 12px; min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><span style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 700; font-size: 22px; line-height: 1">10 × 15</span><span style="font-size: 12px; color: #A8A39A">Good</span></button>
</div>
</div>
<div style="background: #1A1A1C; border: 1px solid #343436; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
<div style="font-weight: 700; font-size: 17px">Cable Chest Fly</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<button aria-label="Set 1: 10 pounds for 15, Good" style="border: 1px solid #343436; background: #0E0E0F; border-radius: 12px; min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><span style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 700; font-size: 22px; line-height: 1">10 × 15</span><span style="font-size: 12px; color: #A8A39A">Good</span></button>
<button aria-label="Set 2: 10 pounds for 15, Good" style="border: 1px solid #343436; background: #0E0E0F; border-radius: 12px; min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><span style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 700; font-size: 22px; line-height: 1">10 × 15</span><span style="font-size: 12px; color: #A8A39A">Good</span></button>
</div>
</div>
<div style="background: #1A1A1C; border: 1px solid #343436; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
<div style="font-weight: 700; font-size: 17px">Wall Slides</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<button aria-label="Set 1: 10 reps, Good" style="border: 1px solid #343436; background: #0E0E0F; border-radius: 12px; min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><span style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 700; font-size: 22px; line-height: 1">10 reps</span><span style="font-size: 12px; color: #A8A39A">Good</span></button>
<button aria-label="Set 2: 10 reps, Good" style="border: 1px solid #343436; background: #0E0E0F; border-radius: 12px; min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><span style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 700; font-size: 22px; line-height: 1">10 reps</span><span style="font-size: 12px; color: #A8A39A">Good</span></button>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; padding-top: 4px">
<div style="font-weight: 700; font-size: 17px; padding: 0 4px">How was the whole shift?</div>
<div role="group" aria-label="Overall feel" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<button style="min-height: 48px; border-radius: 12px; border: 1px solid #343436; background: transparent; font-weight: 600; font-size: 16px">Easy</button>
<button aria-pressed="true" style="min-height: 48px; border-radius: 12px; border: 2px solid #E6D9A8; background: #E6D9A8; color: #0E0E0F; font-weight: 700; font-size: 16px">Normal</button>
<button style="min-height: 48px; border-radius: 12px; border: 1px solid #343436; background: transparent; font-weight: 600; font-size: 16px">Hard</button>
</div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #A8A39A; padding-top: 4px">Note for Coach, optional<textarea rows="3" placeholder="Anything worth remembering?" style="box-sizing: border-box; width: 100%; border-radius: 14px; border: 1px solid #343436; background: #1A1A1C; color: #E6D9A8; padding: 12px 14px; font-size: 16px; resize: none"></textarea></label>
</div>
<div style="flex: 1"></div>
<div style="display: flex; flex-direction: column; gap: 8px">
<button style="border: 0; background: #B81C28; color: #E6D9A8; font-weight: 700; font-size: 18px; min-height: 56px; border-radius: 14px">Save workout</button>
<button style="border: 1px solid #343436; background: transparent; font-weight: 600; font-size: 17px; min-height: 52px; border-radius: 14px">Back to workout</button>
</div>
</div>
</body>
</html>
