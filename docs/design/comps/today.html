<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sweater Today screen</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&display=swap">
<style>
body{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:#B81C28}a:hover{color:#E6D9A8}
</style>
<style>body{background:#0E0E0F}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0E0F; color: #E6D9A8; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 12px">
<div style="display: flex; align-items: center; gap: 10px">
<svg width="30" height="34" viewBox="0 0 108 124" aria-hidden="true"><path d="M6 6h96v62c0 26-20 42-48 50C26 110 6 94 6 68z" fill="#1A1A1C" stroke="#E6D9A8" stroke-width="7" stroke-linejoin="round"></path><rect x="9.5" y="34" width="89" height="7" fill="#B81C28"></rect><rect x="9.5" y="47" width="89" height="17" fill="#E6D9A8"></rect><rect x="9.5" y="70" width="89" height="7" fill="#B81C28"></rect></svg>
<div style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 30px; line-height: 1; letter-spacing: 1px; text-transform: uppercase">Shift</div>
</div>
<button aria-label="Profile" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #343436; background: #1A1A1C; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg></button>
</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; padding: 0 16px 14px">
<button style="border: 0; background: transparent; min-height: 60px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><span style="font-size: 12px; color: #A8A39A">Mon</span><span style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 700; font-size: 22px; line-height: 1">9</span></button>
<button style="border: 0; background: transparent; min-height: 60px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><span style="font-size: 12px; color: #A8A39A">Tue</span><span style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 700; font-size: 22px; line-height: 1">10</span></button>
<button style="border: 0; background: transparent; min-height: 60px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><span style="font-size: 12px; color: #A8A39A">Wed</span><span style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 700; font-size: 22px; line-height: 1">11</span></button>
<button style="border: 0; background: transparent; min-height: 60px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><span style="font-size: 12px; color: #A8A39A">Thu</span><span style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 700; font-size: 22px; line-height: 1">12</span></button>
<button style="border: 0; background: transparent; min-height: 60px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><span style="font-size: 12px; color: #A8A39A">Fri</span><span style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 700; font-size: 22px; line-height: 1">13</span></button>
<button style="border: 0; background: transparent; min-height: 60px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><span style="font-size: 12px; color: #A8A39A">Sat</span><span style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 700; font-size: 22px; line-height: 1">14</span></button>
<button aria-current="date" style="border: 0; background: #B81C28; color: #E6D9A8; min-height: 60px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><span style="font-size: 12px; font-weight: 700">Sun</span><span style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 24px; line-height: 1">15</span></button>
</div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 0 16px">
<div style="background: #1A1A1C; border: 1px solid #343436; border-radius: 20px; overflow: hidden; display: flex; flex-direction: column">
<div aria-hidden="true" style="display: flex; flex-direction: column; gap: 4px; padding-top: 14px">
<div style="height: 4px; background: #B81C28"></div>
<div style="height: 12px; background: #E6D9A8"></div>
<div style="height: 4px; background: #B81C28"></div>
</div>
<div style="padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: baseline; justify-content: space-between"><span style="font-size: 13px; font-weight: 700; color: #F2A41E">Game day</span><span style="font-size: 13px; color: #A8A39A">8:10 PM, Wilmington</span></div>
<div style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 44px; line-height: 0.95; letter-spacing: 0.5px; text-transform: uppercase">Wild Cards<br>vs Jets</div>
<div style="font-size: 15px; color: #A8A39A">No lifting today. Rest and reset before you lace up.</div>
<button style="border: 0; background: #B81C28; color: #E6D9A8; font-weight: 700; font-size: 17px; min-height: 52px; border-radius: 14px">Mark rest day complete</button>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div style="background: #1A1A1C; border: 1px solid #343436; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 13px; color: #A8A39A">Last lift, Mon Nov 9</div>
<div style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 44px; line-height: 0.9">16<span style="color: #A8A39A; font-weight: 700">/16</span></div>
<div style="font-size: 14px; color: #A8A39A">working sets, 70:56</div>
</div>
<div style="background: #1A1A1C; border: 1px solid #343436; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 13px; color: #A8A39A">Weight, Nov 5</div>
<div style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 44px; line-height: 0.9">217<span style="font-size: 22px; color: #A8A39A; font-weight: 700"> LB</span></div>
<div style="font-size: 14px; color: #A8A39A">latest check-in</div>
</div>
</div>
<div style="background: #1A1A1C; border: 1px solid #343436; border-radius: 18px; padding: 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="font-size: 13px; color: #F2A41E; font-weight: 700">Next game</div>
<div style="font-weight: 700; font-size: 17px">Cardinals at Gators</div>
<div style="font-size: 14px; color: #A8A39A">Wed, 10:00 PM</div>
</div>
<div aria-hidden="true" style="width: 52px; height: 52px; border-radius: 12px; border: 2px solid #E6D9A8; display: flex; align-items: center; justify-content: center; font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 28px; line-height: 1">18</div>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #1A1A1C; border-top: 1px solid #343436; padding: 8px 6px 18px">
<button aria-current="page" style="border: 0; background: transparent; min-height: 48px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 700; color: #F2A41E"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Today</button>
<button style="border: 0; background: transparent; min-height: 48px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: #A8A39A"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 8v8M3 10v4M18 8v8M21 10v4M6 12h12"></path></svg>Workout</button>
<button style="border: 0; background: transparent; min-height: 48px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: #A8A39A"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>Progress</button>
<button style="border: 0; background: transparent; min-height: 48px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: #A8A39A"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4h6v3H9zM7 5H5v16h14V5h-2M9 12h6M9 16h4"></path></svg>Coach</button>
</div>
</div>
</body>
</html>
