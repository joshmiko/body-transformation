<!doctype html>

<div style="width: 640px; height: 844px; box-sizing: border-box; padding: 48px; background: #0E0E0F; color: #E6D9A8; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column; gap: 36px">
