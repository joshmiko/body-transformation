<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shift workout screen</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&display=swap">
<style>
body{margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:#F2A41E}a:hover{color:#E6D9A8}
</style>
<style>body{background:#0E0E0F}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0E0F; color: #E6D9A8; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column; padding: 16px 16px 20px; gap: 14px">
<div style="display: flex; align-items: center; justify-content: space-between">
<button aria-label="Workout menu" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #343436; background: #1A1A1C; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01"></path></svg></button>
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
<div style="font-size: 13px; color: #A8A39A">Saturday shift</div>
<div style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 700; font-size: 26px; line-height: 1; letter-spacing: 0.5px">06:40</div>
</div>
<button style="min-width: 64px; height: 44px; border-radius: 22px; border: 1px solid #343436; background: #1A1A1C; font-weight: 600; font-size: 15px; padding: 0 14px">Pause</button>
</div>
<div role="img" aria-label="Exercise 1 of 7" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px">
<div style="height: 6px; border-radius: 3px; background: #E6D9A8"></div>
<div style="height: 6px; border-radius: 3px; background: #343436"></div>
<div style="height: 6px; border-radius: 3px; background: #343436"></div>
<div style="height: 6px; border-radius: 3px; background: #343436"></div>
<div style="height: 6px; border-radius: 3px; background: #343436"></div>
<div style="height: 6px; border-radius: 3px; background: #343436"></div>
<div style="height: 6px; border-radius: 3px; background: #343436"></div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 13px; color: #A8A39A">Exercise 1 of 7</div>
<div style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 48px; line-height: 0.95; letter-spacing: 0.5px; text-transform: uppercase">Leg Press</div>
<div style="font-size: 15px; color: #A8A39A">3 sets of 8 to 12, rest 2:00. Full controlled range; knees track with toes.</div>
</div>
<div style="background: #1A1A1C; border: 1px solid #343436; border-radius: 20px; overflow: hidden; display: flex; flex-direction: column">
<div aria-hidden="true" style="display: flex; flex-direction: column; gap: 3px; padding-top: 12px">
<div style="height: 3px; background: #B81C28"></div>
<div style="height: 10px; background: #E6D9A8"></div>
<div style="height: 3px; background: #B81C28"></div>
</div>
<div style="padding: 16px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<div style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 26px; line-height: 1; letter-spacing: 0.5px; text-transform: uppercase">Set 1</div>
<div style="font-size: 13px; color: #A8A39A">Last time, Oct 17: 517 × 12, Good</div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #A8A39A">Weight, lb<input inputmode="decimal" value="517" style="box-sizing: border-box; width: 100%; height: 64px; border-radius: 14px; border: 1px solid #343436; background: #0E0E0F; color: #E6D9A8; text-align: center; font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 36px"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #A8A39A">Reps<input inputmode="numeric" value="12" style="box-sizing: border-box; width: 100%; height: 64px; border-radius: 14px; border: 1px solid #343436; background: #0E0E0F; color: #E6D9A8; text-align: center; font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 36px"></label>
</div>
<div role="group" aria-label="How did it feel" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<button style="min-height: 48px; border-radius: 12px; border: 1px solid #343436; background: transparent; font-weight: 600; font-size: 16px">Easy</button>
<button aria-pressed="true" style="min-height: 48px; border-radius: 12px; border: 2px solid #E6D9A8; background: #E6D9A8; color: #0E0E0F; font-weight: 700; font-size: 16px">Good</button>
<button style="min-height: 48px; border-radius: 12px; border: 1px solid #343436; background: transparent; font-weight: 600; font-size: 16px">Hard</button>
</div>
<button style="border: 0; background: #B81C28; color: #E6D9A8; font-weight: 700; font-size: 18px; min-height: 56px; border-radius: 14px">Log set, start 2:00 rest</button>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; justify-content: space-between; min-height: 48px; padding: 0 16px; border: 1px solid #343436; border-radius: 14px"><span style="font-weight: 600; font-size: 16px">Set 2</span><span style="font-size: 15px; color: #A8A39A">8 to 12 reps</span></div>
<div style="display: flex; align-items: center; justify-content: space-between; min-height: 48px; padding: 0 16px; border: 1px solid #343436; border-radius: 14px"><span style="font-weight: 600; font-size: 16px">Set 3</span><span style="font-size: 15px; color: #A8A39A">8 to 12 reps</span></div>
</div>
<div style="flex: 1"></div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; background: #1A1A1C; border: 1px solid #343436; border-radius: 16px">
<div style="display: flex; flex-direction: column; gap: 3px">
<div style="font-size: 13px; color: #F2A41E; font-weight: 700">Up next</div>
<div style="font-weight: 700; font-size: 16px">Barbell Romanian Deadlift</div>
</div>
<div style="font-size: 14px; color: #A8A39A; text-align: right">2 sets of 8 to 10</div>
</div>
</div>
</body>
</html>
