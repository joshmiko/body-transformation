<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shift workout saved screen</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&display=swap">
<style>
body{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:#F2A41E}a:hover{color:#E6D9A8}
</style>
<style>body{background:#0E0E0F}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0E0F; color: #E6D9A8; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column; padding: 0 0 24px">
<div aria-hidden="true" style="display: flex; flex-direction: column; gap: 8px; padding-top: 72px">
<div style="height: 8px; background: #B81C28"></div>
<div style="height: 28px; background: #E6D9A8"></div>
<div style="height: 8px; background: #B81C28"></div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; padding: 32px 20px 0">
<div style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 76px; line-height: 0.88; letter-spacing: 0.5px; text-transform: uppercase">Shift<br>over</div>
<div style="font-size: 16px; color: #A8A39A">Mon Nov 9, Chest Strength + Rear Delts</div>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding: 24px 16px 0">
<div style="background: #1A1A1C; border: 1px solid #343436; border-radius: 16px; padding: 14px 12px; display: flex; flex-direction: column; gap: 4px">
<div style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 36px; line-height: 1">16<span style="color: #A8A39A; font-weight: 700">/16</span></div>
<div style="font-size: 13px; color: #A8A39A">working sets</div>
</div>
<div style="background: #1A1A1C; border: 1px solid #343436; border-radius: 16px; padding: 14px 12px; display: flex; flex-direction: column; gap: 4px">
<div style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 36px; line-height: 1">70:56</div>
<div style="font-size: 13px; color: #A8A39A">on the clock</div>
</div>
<div style="background: #1A1A1C; border: 1px solid #343436; border-radius: 16px; padding: 14px 12px; display: flex; flex-direction: column; gap: 4px">
<div style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 36px; line-height: 1; text-transform: uppercase">Normal</div>
<div style="font-size: 13px; color: #A8A39A">overall feel</div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px; padding: 12px 16px 0">
<div style="display: flex; align-items: center; gap: 12px; background: #1A1A1C; border: 1px solid #343436; border-radius: 16px; padding: 14px 16px">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E6D9A8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M7 18a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 9.5a4.25 4.25 0 0 1-.5 8.5z"></path><path d="M9 13.5l2 2 4-4"></path></svg>
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-weight: 700; font-size: 16px">Saved to the cloud</div>
<div style="font-size: 14px; color: #A8A39A">Coach can see this workout now.</div>
</div>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; background: #1A1A1C; border: 1px solid #343436; border-radius: 16px; padding: 14px 16px">
<div style="display: flex; flex-direction: column; gap: 3px">
<div style="font-size: 13px; color: #F2A41E; font-weight: 700">Up next</div>
<div style="font-weight: 700; font-size: 16px">Zone 2 bike</div>
<div style="font-size: 14px; color: #A8A39A">Tuesday, 30 to 40 minutes</div>
</div>
<div aria-hidden="true" style="width: 52px; height: 52px; border-radius: 12px; border: 2px solid #E6D9A8; display: flex; align-items: center; justify-content: center; font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 28px; line-height: 1">10</div>
</div>
</div>
<div style="flex: 1"></div>
<div style="display: flex; flex-direction: column; gap: 8px; padding: 0 16px">
<button style="border: 0; background: #B81C28; color: #E6D9A8; font-weight: 700; font-size: 18px; min-height: 56px; border-radius: 14px">Done</button>
<button style="border: 0; background: transparent; color: #F2A41E; font-weight: 600; font-size: 16px; min-height: 44px">View workout details</button>
</div>
</div>
</body>
</html>
