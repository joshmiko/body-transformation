function saveNote(d,i){db.notes[PROGRAM[d].exercises[i].name]=document.getElementById("note").value;save();render(d,i)}
function render(d,ei){let p=PROGRAM[d],e=p.exercises[ei],s=sets(d,ei,e.sets),t=target(e,s),wu=warmups(e,startWeight(e,s)),done=s.filter(x=>x.done).length,note=db.notes[e.name]||"",prev=previousActual(e.name).at(-1);
document.getElementById("app").innerHTML=`<div class="row"><button class="ghost" onclick="workouts()">‹ Back</button><span class="muted">${done}/${e.sets} sets • Exercise ${ei+1}/${p.exercises.length}</span><button class="ghost" onclick="coach()">Coach</button></div><div class="card exercise"><div class="exercisehead"><div class="row"><div style="display:flex;gap:11px;align-items:center"><div class="icon">🏋</div><div><div class="ename">${e.name}</div><div class="meta">${e.type} • ${e.min}–${e.max} reps • Rest ${Math.floor(e.rest/60)}:${String(e.rest%60).padStart(2,"0")}</div></div></div><span class="pill greenpill">${done}/${e.sets}</span></div></div>${prev?`<div class="history">Last actual: <b style="color:#fff">${prev.w} × ${prev.r}</b>${prev.feel?" • "+prev.feel:""} • ${prev.date}</div>`:""}<div class="setup"><div class="setupicon">📝</div><div class="setuptext"><b>SETUP NOTE</b><div>${note||"Add rack, seat, incline, pulley or equipment details."}</div></div><button class="editbtn" onclick="setupNote('${d}',${ei})">Edit</button></div><div class="target"><div><div class="label">Coach target</div><div class="big">${t.w||"—"} lb × ${t.r}</div></div><div class="why">${t.why}</div></div>${wu.length?`<div class="section warm"><div class="sectitle"><span class="dot"></span>WARM-UP SETS</div><span class="muted">Not counted toward progression</span></div><div class="table"><div class="thead"><span>SET</span><span>WEIGHT</span><span>REPS</span><span>✓</span></div>${wu.map((x,j)=>{let z=wud(d,ei,j);return`<div class="srow warmrow"><span class="wbadge">W</span><input value="${z.w||x[0]}" inputmode="decimal" onchange="wuEdit('${d}',${ei},${j},'w',this.value)"><input value="${z.r||x[1]}" inputmode="numeric" onchange="wuEdit('${d}',${ei},${j},'r',this.value)"><button class="check ${z.done?"done":""}" onclick="wuDone('${d}',${ei},${j})">${z.done?"✓":"○"}</button></div>`}).join("")}</div>`:""}<div class="section work"><div class="sectitle"><span class="dot"></span>WORKING SETS</div><span class="muted">${done<e.sets?"Set "+(done+1)+" of "+e.sets:"Complete"} • ${e.min}–${e.max} reps</span></div><div class="table"><div class="thead"><span>SET</span><span>WEIGHT</span><span>REPS</span><span>✓</span></div>${s.map((x,j)=>{let ww=x.weight||(!x.done?(j?s[j-1].weight||t.w:t.w):""),rr=x.reps||(!x.done?t.r:"");let current=!x.done && !s.slice(0,j).some(z=>!z.done), cls=x.done?"completedset":current?"currentset":"upcomingset";return`${current?`<div class="current-label">NOW • CURRENT SET</div>`:""}<div class="srow workrow ${cls}"><span class="num">${j+1}</span><input value="${ww}" inputmode="decimal" onchange="edit('${d}',${ei},${j},'weight',this.value)"><input value="${rr}" inputmode="numeric" onchange="edit('${d}',${ei},${j},'reps',this.value)"><button class="check ${x.done?"done":""}" onclick="mark('${d}',${ei},${j})">${x.done?"✓":"○"}</button></div>${x.done?`<div class="feel"><span class="muted" style="align-self:center">FEEL</span>${["Easy","Good","Hard"].map(q=>`<button class="${x.feel===q?"sel":""}" onclick="feel('${d}',${ei},${j},'${q}')">${q}</button>`).join("")}</div>`:""}`}).join("")}</div><div class="bottomactions"><button class="secondary" onclick="rest(${e.rest})">Rest</button><button class="secondary" onclick="setupNote('${d}',${ei})">📝 Note</button><button class="next" onclick="${ei<p.exercises.length-1?`render('${d}',${ei+1})`:`finish('${d}')`}">${ei<p.exercises.length-1?"Next Exercise":"Finish Workout"} →</button></div><div class="card"><div class="small"><b style="color:#fff">Form cue:</b> ${e.cue}</div></div></div>`}
function workouts(){
 nav("nWorkout");
 const names=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
 const todayName=names[new Date().getDay()];
 const order=["Monday","Friday","Saturday"];
 document.getElementById("app").innerHTML=`<div class="hero"><div class="ey">TRAINING PLAN • V12</div><h2>Workouts</h2><div class="daylabel" style="margin-top:10px">MONDAY • FRIDAY • SATURDAY</div><div class="muted">Your programmed week. Tap any day to preview or train.</div></div>
 ${order.map(d=>{
   const p=PROGRAM[d],s=latestSessionForDay(d),inprog=s&&!s.finished,done=s&&s.finished;
   return `<div class="card daycard" onclick="start('${d}')"><div class="row"><div><div class="daylabel">${d.toUpperCase()} ${d===todayName?"• TODAY":""}</div><div class="daytitle">${p.title}</div><div class="daydesc">${p.subtitle}</div></div><div>${inprog?'<span class="inprogress">IN PROGRESS</span>':done?'<span class="todaytag">COMPLETED</span>':'<span class="muted">›</span>'}</div></div></div>`;
 }).join("")}
 <div class="card daycard" onclick="selectDay('Wednesday')"><div class="row"><div><div class="daylabel">WEDNESDAY ${todayName==="Wednesday"?"• TODAY":""}</div><div class="daytitle">Yoga / Recovery</div><div class="daydesc">Mobility, recovery and DOMS tracking</div></div><span class="muted">›</span></div></div>
 <div class="card"><div class="small"><b style="color:var(--text)">Tip:</b> Selecting another day only lets you preview/train that programmed day. It does not change the calendar date or overwrite today's session.</div></div>`;
}
function start(d){
 selected=d;nav("nWorkout");
 if(!PROGRAM[d].exercises.length)return home();
 const s=latestSessionForDay(d);
 let first=0;
 if(s&&!s.finished){
   for(let i=0;i<PROGRAM[d].exercises.length;i++){
     const a=s.exercises?.[String(i)]?.actual||[];
     if(a.some(x=>!x.done)){first=i;break}
     first=Math.min(i+1,PROGRAM[d].exercises.length-1);
   }
 }
 render(d,first);
}
function finish(d){let s=getSession(d);s.finished=new Date().toISOString();s.stats={};completeStats(s);save();document.getElementById("app").innerHTML=`<div class="hero" style="text-align:center;padding:28px 18px"><div style="font-size:50px;color:var(--green)">✓</div><div class="ey">WORKOUT COMPLETE</div><h2>Great work.</h2><div class="muted">${s.stats.completedSets}/${s.stats.workingSets} working sets saved</div><button class="primary" style="margin-top:16px" onclick="home()">Done</button></div>`}
function completeStats(s){s.stats.workingSets=0;s.stats.completedSets=0;Object.values(s.exercises||{}).forEach(e=>{s.stats.workingSets+=e.planned.sets;s.stats.completedSets+=(e.actual||[]).filter(x=>x.done).length})}
function exportPayload(){
 let cutoff=db.lastSync||"1970-01-01T00:00:00.000Z";
 let sessions=Object.values(db.sessions).filter(s=>s.finished&&s.finished>cutoff).map(s=>({date:s.date,day:s.day,started:s.started,finished:s.finished,stats:s.stats,exercises:Object.values(s.exercises||{}).map(e=>({name:e.name,planned:e.planned,actual:e.actual}))}));
 let checkins=db.checkins.filter(c=>!c.syncedAt||c.createdAt>cutoff);
 let payload={schema:"body-transformation-sync-v1",generatedAt:new Date().toISOString(),since:cutoff,userContext:{goals:["build muscle","lose fat","stronger","athletic","hockey"],sessionTarget:"45–50 minutes",weeklySchedule:"Monday, Friday, Saturday lifting; Wednesday yoga"},sessions,checkins,exerciseSetupNotes:db.notes,program:PROGRAM,strongHistorySummary:{rows:HISTORY.meta.rows,dateMin:HISTORY.meta.date_min,dateMax:HISTORY.meta.date_max},coachInstructions:"Analyze training and body-composition trends. Update the daily check-in/coaching summary and recommend program changes only when supported by multiple data points. Do not let one bad workout rewrite the whole program. Keep the user's goal of aggressive fat loss while preserving muscle, strength and hockey performance."};
 return payload;
}
function sync(){let p=exportPayload(),txt=JSON.stringify(p,null,2);db.syncLog.push({at:new Date().toISOString(),sessions:p.sessions.length,checkins:p.checkins.length});db.lastSync=new Date().toISOString();save();document.getElementById("app").innerHTML=`<div class="hero"><div class="ey">CHATGPT SYNC</div><h2>Coaching package ready</h2><div class="syncstatus"><span class="syncdot"></span>${p.sessions.length} new session(s) • ${p.checkins.length} new check-in(s)</div><p class="small" style="margin-top:12px">Copy this structured package into the Body Transformation ChatGPT conversation. It contains new results and the context needed to update your daily check-in and evaluate program changes.</p><div class="syncbox"><textarea id="payload" readonly></textarea><button class="primary copybtn" onclick="copyPayload()">Copy coaching package</button></div><button class="secondary" style="width:100%;margin-top:8px" onclick="sync()">Generate again</button></div><div class="card"><h3>After ChatGPT reviews it</h3><p class="small">Paste the package into ChatGPT. Ask for the updated daily check-in and any warranted program changes.</p></div>`;document.getElementById("payload").value=txt}
function copyPayload(){let t=document.getElementById("payload");if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t.value).then(()=>{event.target.textContent="Copied ✓";setTimeout(()=>event.target.textContent="Copy coaching package",1200)}).catch(()=>fallbackCopy(t))}else fallbackCopy(t)}
function fallbackCopy(t){t.focus();t.select();try{document.execCommand("copy");event.target.textContent="Copied ✓";setTimeout(()=>event.target.textContent="Copy coaching package",1200)}catch(e){alert("Select the package and copy it manually.")}}
function importInstructions(){document.getElementById("app").innerHTML=`<div class="hero"><div class="ey">CHATGPT LOOP</div><h2>How syncing works</h2><div class="small">1. Train normally. 2. Open Sync. 3. Copy the coaching package. 4. Paste it into ChatGPT. 5. ChatGPT analyzes the new data and updates your daily check-in/program recommendation.</div></div><div class="card"><h3>Why this is separate</h3><p class="small">The local iPhone app cannot directly read this ChatGPT conversation. V12 therefore creates a structured handoff instead of pretending the connection is automatic.</p></div><div class="card"><h3>What ChatGPT receives</h3><div class="chips"><span class="tag">actual sets</span><span class="tag">planned sets</span><span class="tag">progression</span><span class="tag">feel</span><span class="tag">recovery</span><span class="tag">check-ins</span><span class="tag">setup notes</span><span class="tag">Strong history</span></div></div><button class="primary" onclick="sync()">Create Sync Package →</button>`}

function home(forceToday=false){
 const names=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],short=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
 const todayName=names[new Date().getDay()];
 if(forceToday || !selected) selected=PROGRAM[todayName]?todayName:(["Monday","Wednesday","Friday","Saturday"].find(d=>names.indexOf(d)>=new Date().getDay())||"Monday");
 nav("nToday");
 const scheduled=!!PROGRAM[selected];
 const p=PROGRAM[selected]||PROGRAM["Monday"];
 const s=scheduled?db.sessions[sessionKey(selected)]:null,done=s?.finished;
 const pct=done?100:(s?.stats?Math.round(s.stats.completedSets/s.stats.workingSets*100):0);
 const days=names.map((d,i)=>`<button class="day ${d===selected?"sel":""}" onclick="selectDay('${d}')"><b>${short[i]}</b><span>${i===new Date().getDay()?"•":" "}</span></button>`).join("");
 let body="";
 if(!scheduled){
   const order=["Monday","Wednesday","Friday","Saturday"], todayIndex=new Date().getDay();
   const next=order.find(d=>names.indexOf(d)>=todayIndex)||order[0];
   body=`<div class="card"><div class="ey">OFF DAY</div><h3>No workout scheduled today</h3><p class="small">Today is ${todayName}. Your next programmed session is <b>${PROGRAM[next].title}</b>.</p><button class="primary" onclick="selectDay('${next}')">View ${next} →</button></div>`;
 }else if(selected==="Wednesday"){
   body=`<div class="card"><div class="ey">RECOVERY</div><h3>Yoga / recovery day</h3><p class="small">Track whether Monday soreness is affecting mobility. No lifting session is scheduled.</p></div>`;
 }else{
   body=`<div class="hero"><div class="ey">TODAY • ${todayName.toUpperCase()} ${new Date().toLocaleDateString(undefined,{month:"short",day:"numeric"})}</div><h2>${p.title}</h2><div class="muted">${p.subtitle}</div><div style="margin-top:12px"><div class="row"><span class="muted">${done?"Workout complete":"Ready to train"}</span><span class="ey">${pct}%</span></div><div class="progressbar" style="margin-top:6px"><i style="width:${pct}%"></i></div><button class="primary" style="margin-top:12px" onclick="start('${selected}')">${done?"Review Workout":"Start Workout"} →</button></div></div>`;
 }
 document.getElementById("app").innerHTML=`<div class="days">${days}</div>${body}<div class="card"><h3>This week's plan</h3>${["Monday","Wednesday","Friday","Saturday"].map(d=>`<div class="history row" onclick="selectDay('${d}')"><div><b>${PROGRAM[d].title}</b><div class="muted">${d}</div></div><span>›</span></div>`).join("")}</div><div class="card"><h3>Training intelligence</h3><div class="metricgrid"><div class="metric"><div class="mini">SQUAT REF</div><b>205 × 8</b></div><div class="metric"><div class="mini">PULL-UPS</div><b>4</b></div><div class="metric"><div class="mini">SESSION</div><b>45–50m</b></div></div></div>`;
}
function selectDay(d){selected=d;nav("nToday");home(false)}
function progress(){nav("nProgress");let l=db.checkins.at(-1),p=db.checkins.at(-2),delta=l&&p&&l.weight&&p.weight?(+l.weight-+p.weight).toFixed(1):"—",sessions=Object.values(db.sessions).filter(s=>s.finished).length;document.getElementById("app").innerHTML=`<div class="card"><div class="ey">PROGRESS</div><h2>Training dashboard</h2><div class="metricgrid"><div class="metric"><div class="mini">WEIGHT</div><b>${l?.weight||"—"}</b><div class="muted">${delta==="—"?"":(delta>0?"+":"")+delta+" lb"}</div></div><div class="metric"><div class="mini">WAIST</div><b>${l?.waist||"—"}</b><div class="muted">in</div></div><div class="metric"><div class="mini">SESSIONS</div><b>${sessions}</b></div></div></div><div class="card"><h3>Weekly check-in</h3><input id="pw" class="noteinput" style="min-height:0" inputmode="decimal" placeholder="Body weight (lb)" value="${l?.weight||""}"><input id="pz" class="noteinput" style="min-height:0;margin-top:7px" inputmode="decimal" placeholder="Waist (in, optional)" value="${l?.waist||""}"><textarea id="pn" class="noteinput" style="margin-top:7px" placeholder="Recovery, soreness, hunger, hockey...">${l?.notes||""}</textarea><button class="primary" style="margin-top:8px" onclick="saveCheck()">Save Check-in</button></div><div class="card"><h3>ChatGPT coaching sync</h3><div class="syncstatus"><span class="syncdot"></span>${db.lastSync?"Last generated "+new Date(db.lastSync).toLocaleString():"Not synced yet"}</div><button class="secondary" style="width:100%;margin-top:8px" onclick="sync()">Sync new results with ChatGPT →</button></div>`}
function saveCheck(){db.checkins.push({date:today(),createdAt:new Date().toISOString(),weight:document.getElementById("pw").value,waist:document.getElementById("pz").value,notes:document.getElementById("pn").value});save();progress()}
function coach(){nav("nCoach");document.getElementById("app").innerHTML=`<div class="hero"><div class="ey">ADAPTIVE COACH</div><h2>Train. Record. Sync.</h2><div class="muted">Immediate decisions happen in the app; higher-level coaching happens in ChatGPT.</div></div><div class="card"><h3>Automatic gym decisions</h3><div class="history row"><b>Top of range + good</b><span class="badge badge-green">PROGRESS</span></div><div class="history row"><b>Middle of range</b><span class="badge bluepill">ADD REPS</span></div><div class="history row"><b>Hard / failure</b><span class="badge badge-red">HOLD / REDUCE</span></div></div><div class="card"><h3>ChatGPT layer</h3><p class="small">Use Sync to send accumulated results for broader analysis: strength trends, volume, recovery, body composition, nutrition/activity context and whether the program itself should change.</p><button class="primary" onclick="sync()">Create ChatGPT Package →</button></div>`}
function rest(sec){let el=document.createElement("div");el.className="timer";el.innerHTML=`<div class="timerbox"><div class="muted">REST TIMER</div><div id="clock" class="clock">${sec}</div><button class="secondary" onclick="this.parentElement.parentElement.remove()">Close</button></div>`;document.body.append(el);let n=sec;window._timer=setInterval(()=>{n--;let c=document.getElementById("clock");if(c)c.textContent=n<=0?"GO":n;if(n<=0)clearInterval(window._timer)},1000)}
home();
</script></body></html>
