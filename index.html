<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Body Transformation</title><link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#111827;color:#fff;padding:18px 17px calc(14px + env(safe-area-inset-top));position:sticky;top:0;z-index:5}
h1{font-size:23px;margin:0}.sub{font-size:12px;opacity:.7;margin-top:3px}
main{max-width:720px;margin:auto;padding:15px 14px 95px}.card{background:#fff;border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 1px 4px #00000010}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.muted{font-size:12px;color:#6b7280}.big{font-size:28px;font-weight:800}
button{font:inherit}button.primary{border:0;background:#111827;color:#fff;border-radius:11px;padding:11px 14px;font-weight:700}
button.secondary{border:0;background:#eef0f3;border-radius:10px;padding:9px 11px}
.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:12px}.tabs button{border:0;background:#e7e9ed;border-radius:99px;padding:9px 12px;white-space:nowrap}.tabs .sel{background:#111827;color:#fff}
.exercise{border-top:1px solid #eee;padding-top:14px;margin-top:14px}.exercise:first-child{border-top:0;margin-top:0;padding-top:0}
.badge{font-size:10px;padding:4px 7px;border-radius:99px;background:#eef0f3}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.setgrid{display:grid;grid-template-columns:34px 1fr 1fr 1fr;gap:6px;align-items:center;margin-top:8px}.setgrid input{min-width:0;padding:9px;border:1px solid #d5d8dd;border-radius:8px;font-size:16px}
label{font-size:10px;color:#6b7280}.setnum{font-weight:700;text-align:center}.timer{font-size:34px;text-align:center;font-weight:800;margin:5px}.tip{font-size:13px;line-height:1.4;background:#f7f7f8;border-radius:10px;padding:10px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;z-index:10;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:transparent;padding:10px 2px;font-size:11px;color:#6b7280}nav button.active{color:#111827;font-weight:800}
hr{border:0;border-top:1px solid #eee}.success{font-size:13px;font-weight:700}
</style></head>
<body>
<header><h1>Body Transformation</h1><div class="sub">Training • nutrition • recovery • progression</div></header>
<main id="app"></main>
<nav><button id="homeNav" onclick="home()">🏠<br>Today</button><button id="workNav" onclick="chooseWorkout()">🏋️<br>Workout</button><button id="progNav" onclick="progress()">📈<br>Progress</button><button id="coachNav" onclick="coach()">🧠<br>Coach</button></nav>
<script>
const P={"Monday": {"title": "Monday \u2022 Lower + Push", "focus": "Strength + muscle \u2022 manage Monday leg fatigue", "notes": "Keep the main lower-body work controlled so Wednesday yoga and Friday/Saturday training remain productive.", "exercises": [["Back Squat", "compound", 3, "6\u20138", 150, "Start around a repeatable working weight; progress only when reps/RIR support it."], ["Barbell Bench Press", "compound", 3, "6\u201310", 150, "Primary horizontal press. Use barbell as the main bench pattern."], ["Lat Pulldown", "compound", 3, "8\u201312", 90, "Controlled eccentric; aim to build toward 135 lb again."], ["DB Romanian Deadlift", "compound", 2, "8\u201312", 120, "Moderate volume; don't turn Monday into a second maximal hinge day."], ["DB Lateral Raise", "isolation", 2, "10\u201315", 60, "Strict reps."]]}, "Wednesday": {"title": "Wednesday \u2022 Yoga / Recovery", "focus": "Mobility + recovery", "notes": "Keep it restorative/moderate. Monitor whether Monday leg DOMS interferes with yoga.", "exercises": []}, "Friday": {"title": "Friday \u2022 Upper + Pull", "focus": "Upper-body hypertrophy + pull-up development", "notes": "Avoid unnecessary lower-body fatigue before Saturday.", "exercises": [["Barbell Bench Press", "compound", 3, "6\u201310", 150, "Progress with reps first; don't chase old powerlifting numbers during the fat-loss phase."], ["1-Arm DB Row", "compound", 3, "8\u201312", 90, "Stable torso; full range."], ["Lat Pulldown", "compound", 3, "8\u201312", 90, "Use as the main vertical pull if pull-ups aren't ready for full volume."], ["Dead Hang", "skill/grip", 2, "20\u201345 sec", 60, "Add time gradually; quality grip and shoulder position."], ["DB Hammer Curl", "isolation", 2, "8\u201312", 60, "Controlled."], ["Cable/DB Triceps", "isolation", 2, "10\u201315", 60, "Optional if time remains."]]}, "Saturday": {"title": "Saturday \u2022 Legs + Athletic", "focus": "Leg hypertrophy + athletic capacity", "notes": "This is the leg day you were logging in Strong. Keep heavy squatting here moderate if Monday is the main squat stimulus.", "exercises": [["Leg Press", "compound", 3, "8\u201312", 120, "Hard, controlled sets without grinding."], ["Walking Lunge", "compound", 2, "8\u201312/leg", 90, "You have used 25 lb DBs; progress based on form and RIR."], ["DB/Seated Shoulder Press", "compound", 3, "6\u201310", 120, "Use a load you can control without grinding."], ["DB Romanian Deadlift", "compound", 2, "8\u201312", 120, "Optional on weeks when Monday soreness/recovery is poor."], ["Calf Raise", "isolation", 3, "12\u201320", 60, "Prior sessions suggest 60 lb total felt appropriate; adjust by RIR."], ["Dead Hang", "skill/grip", 2, "20\u201345 sec", 60, "Short finisher if grip is fresh."]]}};
const H={"Squat (Barbell)": {"sessions": 18, "best_weight": 225.0, "best_set": {"weight": 225.0, "reps": 5}, "recent": [{"date": "2026-08-02", "weight": 45.0, "reps": 5}, {"date": "2026-08-02", "weight": 135.0, "reps": 2}, {"date": "2026-08-02", "weight": 175.0, "reps": 1}, {"date": "2026-08-02", "weight": 200.0, "reps": 8}, {"date": "2026-08-02", "weight": 200.0, "reps": 8}, {"date": "2026-08-02", "weight": 200.0, "reps": 8}, {"date": "2026-08-22", "weight": 205.0, "reps": 8}, {"date": "2026-08-22", "weight": 185.0, "reps": 2}, {"date": "2026-08-22", "weight": 205.0, "reps": 8}, {"date": "2026-08-22", "weight": 45.0, "reps": 5}, {"date": "2026-08-22", "weight": 135.0, "reps": 5}, {"date": "2026-08-22", "weight": 205.0, "reps": 8}]}, "Deadlift (Barbell)": {"sessions": 3, "best_weight": 275.0, "best_set": {"weight": 275.0, "reps": 3}, "recent": [{"date": "2025-08-15", "weight": 250.0, "reps": 3}, {"date": "2025-08-15", "weight": 250.0, "reps": 3}, {"date": "2025-08-15", "weight": 250.0, "reps": 3}, {"date": "2025-08-15", "weight": 250.0, "reps": 3}, {"date": "2025-08-15", "weight": 225.0, "reps": 3}, {"date": "2025-08-15", "weight": 135.0, "reps": 5}, {"date": "2026-01-30", "weight": 135.0, "reps": 5}, {"date": "2026-01-30", "weight": 225.0, "reps": 5}, {"date": "2026-01-30", "weight": 250.0, "reps": 5}, {"date": "2026-01-30", "weight": 250.0, "reps": 5}, {"date": "2026-01-30", "weight": 250.0, "reps": 5}, {"date": "2026-01-30", "weight": 250.0, "reps": 5}]}, "Bench Press (Barbell)": {"sessions": 23, "best_weight": 185.0, "best_set": {"weight": 185.0, "reps": 3}, "recent": [{"date": "2026-05-29", "weight": 150.0, "reps": 5}, {"date": "2026-05-29", "weight": 150.0, "reps": 5}, {"date": "2026-05-29", "weight": 150.0, "reps": 5}, {"date": "2026-05-29", "weight": 150.0, "reps": 5}, {"date": "2026-05-29", "weight": 150.0, "reps": 5}, {"date": "2026-06-09", "weight": 155.0, "reps": 5}, {"date": "2026-06-09", "weight": 155.0, "reps": 5}, {"date": "2026-06-09", "weight": 155.0, "reps": 5}, {"date": "2026-06-09", "weight": 135.0, "reps": 5}, {"date": "2026-06-09", "weight": 45.0, "reps": 5}, {"date": "2026-06-09", "weight": 155.0, "reps": 5}, {"date": "2026-06-09", "weight": 155.0, "reps": 5}]}, "Bench Press (Dumbbell)": {"sessions": 13, "best_weight": 75.0, "best_set": {"weight": 75.0, "reps": 8}, "recent": [{"date": "2026-08-04", "weight": 75.0, "reps": 8}, {"date": "2026-08-04", "weight": 75.0, "reps": 6}, {"date": "2026-08-04", "weight": 75.0, "reps": 5}, {"date": "2026-08-10", "weight": 70.0, "reps": 8}, {"date": "2026-08-10", "weight": 70.0, "reps": 8}, {"date": "2026-08-10", "weight": 70.0, "reps": 8}, {"date": "2026-08-17", "weight": 75.0, "reps": 8}, {"date": "2026-08-17", "weight": 75.0, "reps": 8}, {"date": "2026-08-17", "weight": 75.0, "reps": 8}, {"date": "2026-08-24", "weight": 75.0, "reps": 8}, {"date": "2026-08-24", "weight": 75.0, "reps": 8}, {"date": "2026-08-24", "weight": 75.0, "reps": 8}]}, "Lat Pulldown (Cable)": {"sessions": 12, "best_weight": 135.0, "best_set": {"weight": 135.0, "reps": 10}, "recent": [{"date": "2026-07-12", "weight": 100.0, "reps": 10}, {"date": "2026-07-31", "weight": 120.0, "reps": 12}, {"date": "2026-07-31", "weight": 120.0, "reps": 12}, {"date": "2026-07-31", "weight": 120.0, "reps": 10}, {"date": "2026-08-13", "weight": 115.0, "reps": 12}, {"date": "2026-08-13", "weight": 115.0, "reps": 12}, {"date": "2026-08-13", "weight": 115.0, "reps": 12}, {"date": "2026-08-22", "weight": 120.0, "reps": 12}, {"date": "2026-08-22", "weight": 120.0, "reps": 12}, {"date": "2026-08-22", "weight": 120.0, "reps": 10}, {"date": "2026-08-28", "weight": 120.0, "reps": 10}, {"date": "2026-08-28", "weight": 120.0, "reps": 8}]}, "Pull Up (Assisted)": {"sessions": 7, "best_weight": 150.0, "best_set": {"weight": 150.0, "reps": 10}, "recent": [{"date": "2025-08-29", "weight": 80.0, "reps": 5}, {"date": "2025-08-29", "weight": 80.0, "reps": 5}, {"date": "2025-08-29", "weight": 80.0, "reps": 5}, {"date": "2025-12-19", "weight": 150.0, "reps": 10}, {"date": "2025-12-19", "weight": 150.0, "reps": 10}, {"date": "2025-12-19", "weight": 150.0, "reps": 10}, {"date": "2026-03-30", "weight": 150.0, "reps": 8}, {"date": "2026-03-30", "weight": 120.0, "reps": 8}, {"date": "2026-03-30", "weight": 120.0, "reps": 8}, {"date": "2026-04-06", "weight": 120.0, "reps": 10}, {"date": "2026-04-06", "weight": 120.0, "reps": 10}, {"date": "2026-04-06", "weight": 120.0, "reps": 10}]}};
let logs=JSON.parse(localStorage.getItem("bt_v2_logs")||"{}");
let checkins=JSON.parse(localStorage.getItem("bt_v2_checkins")||"[]");
let selectedDay=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][new Date().getDay()];
if(!P[selectedDay]) selectedDay="Monday";
function save(){localStorage.setItem("bt_v2_logs",JSON.stringify(logs));localStorage.setItem("bt_v2_checkins",JSON.stringify(checkins))}
function nav(id){document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));document.getElementById(id)?.classList.add("active")}
function home(){nav("homeNav");let d=selectedDay,p=P[d];document.getElementById("app").innerHTML=`
<div class="card"><div class="muted">TODAY</div><h2>${p.title}</h2><p>${p.focus}</p>${d==="Wednesday"?'<p class="tip">Recovery day. Note whether Monday leg soreness is still affecting yoga.</p>':'<button class="primary" onclick="workout(\\''+d+'\\')">Start today\\'s workout</button>'}</div>
<div class="grid"><div class="card"><div class="muted">SCHEDULE</div><b>Mon / Wed / Fri / Sat</b><p class="muted">3 lifting days + yoga</p></div><div class="card"><div class="muted">SESSION TARGET</div><b>45–50 min</b><p class="muted">Efficient working sets</p></div></div>
<div class="card"><h3>Current performance</h3><p>Squat: <b>205 × 8</b><br>DB bench: <b>75 × 8</b><br>DB row: <b>65 × 10</b><br>Lat pulldown: <b>135 × 12 historical best</b><br>Pull-ups: <b>4 consecutive</b></p></div>
<div class="card"><h3>Fat-loss phase</h3><p class="muted">Goal: aggressive fat loss while preserving/building muscle and strength. The coach should prioritize performance and recovery rather than blindly adding volume.</p></div>`}
function chooseWorkout(){nav("workNav");document.getElementById("app").innerHTML='<div class="card"><h2>Choose workout</h2><div class="tabs">'+Object.keys(P).map(d=>`<button class="${d===selectedDay?'sel':''}" onclick="selectedDay='${d}';workout('${d}')">${d}</button>`).join("")+'</div></div>';workout(selectedDay)}
function workout(day){selectedDay=day;nav("workNav");let p=P[day];if(day==="Wednesday"){home();return}
document.getElementById("app").innerHTML='<div class="card"><div class="tabs">'+Object.keys(P).map(d=>`<button class="${d===day?'sel':''}" onclick="workout('${d}')">${d}</button>`).join("")+'</div><h2>'+p.title+'</h2><p class="muted">'+p.notes+'</p></div>'+
p.exercises.map((e,i)=>exercise(day,e,i)).join("")+
'<div class="card"><button class="primary" style="width:100%" onclick="finish(\\''+day+'\\')">Finish & save workout</button></div>'}
function exercise(day,e,i){let key=day+"_"+i;let old=logs[key]||Array(3).fill(0).map(()=>({w:"",r:"",rir:""}));return `<div class="card exercise"><div class="row"><div><b>${e[0]}</b><div class="muted">${e[1]} • ${e[3]} reps • ${e[4]}s rest</div></div><span class="badge">${e[1]}</span></div><div class="tip" style="margin-top:8px">${e[5]}</div><div class="setgrid"><span></span><label>LB</label><label>REPS</label><label>RIR</label>${old.map((s,j)=>`<span class="setnum">${j+1}</span><input inputmode="decimal" placeholder="—" value="${s.w}" onchange="edit('${key}',${j},'w',this.value)"><input inputmode="numeric" placeholder="—" value="${s.r}" onchange="edit('${key}',${j},'r',this.value)"><input inputmode="numeric" placeholder="—" value="${s.rir}" onchange="edit('${key}',${j},'rir',this.value)">`).join("")}</div><button class="secondary" style="margin-top:9px" onclick="rest(${e[4]})">Rest ${e[4]}s</button></div>`}
function edit(k,j,f,v){if(!logs[k])logs[k]=Array(3).fill(0).map(()=>({w:"",r:"",rir:""}));logs[k][j][f]=v;save()}
function rest(sec){let n=sec,box=document.createElement("div");box.className="card";box.style.cssText="position:fixed;z-index:20;left:10%;right:10%;top:30%;box-shadow:0 8px 30px #0004";box.innerHTML=`<div class="timer">${n}</div><button class="primary" style="width:100%" onclick="this.parentNode.remove()">Close</button>`;document.body.appendChild(box);let t=setInterval(()=>{n--;box.querySelector(".timer").textContent=n<=0?"GO":n;if(n<=0)clearInterval(t)},1000)}
function finish(day){save();alert("Saved. The next progression decision should use your reps + RIR + recovery.");home()}
function progress(){nav("progNav");let last=checkins.at(-1);document.getElementById("app").innerHTML=`<div class="card"><h2>Weekly check-in</h2><label>Body weight (lb)</label><input id="weight" inputmode="decimal" placeholder="e.g. 223"><label style="display:block;margin-top:9px">Waist (in)</label><input id="waist" inputmode="decimal" placeholder="Optional"><label style="display:block;margin-top:9px">Recovery / soreness / hunger</label><input id="notes" placeholder="e.g. legs sore, sleep good"><button class="primary" style="margin-top:12px" onclick="checkin()">Save check-in</button></div>
<div class="card"><h3>Check-in history</h3>${checkins.slice(-10).reverse().map(x=>`<p><b>${x.date}</b> — ${x.weight||'—'} lb ${x.waist?'• '+x.waist+' in':''}<br><span class="muted">${x.notes||''}</span></p>`).join("")||'<p class="muted">No check-ins yet.</p>'}</div>
<div class="card"><h3>Historical Strong data</h3>${Object.entries(H).map(([e,x])=>`<p><b>${e.replaceAll(" (Barbell)","").replaceAll(" (Dumbbell)","").replaceAll(" (Cable)","")}</b><br><span class="muted">${x.sessions} sessions • best ${x.best_weight} lb × ${x.best_set.reps}</span></p>`).join("")}</div>`}
function checkin(){checkins.push({date:new Date().toLocaleDateString(),weight:document.getElementById("weight").value,waist:document.getElementById("waist").value,notes:document.getElementById("notes").value});save();progress()}
function coach(){nav("coachNav");document.getElementById("app").innerHTML=`<div class="card"><h2>Coach</h2><p><b>Current rules</b></p><ul><li>Most working sets: roughly 1–3 RIR.</li><li>Earn load increases with repeatable reps and good form.</li><li>If performance falls and recovery is poor, hold or reduce rather than forcing progression.</li><li>During aggressive fat loss, preserve strength and muscle; extra volume is not automatically better.</li><li>Saturday leg fatigue is monitored against Monday performance and Wednesday yoga.</li></ul></div><div class="card"><h3>Recent training signals</h3><p>Strong shows squat <b>205 × 8</b> on Aug 22 and DB bench <b>75 × 8</b> on Aug 24. Use the app's new logs to establish current RIR and recovery before making larger changes.</p></div><div class="card"><h3>Historical PRs</h3><p>Strong history contains older powerlifting-era work, including heavier barbell squat/bench/deadlift sets. Those remain historical records—not automatic current targets.</p></div>`}
home();
</script></body></html>
