let logs=JSON.parse(localStorage.getItem("bt2_logs")||"{}");

function save(){localStorage.setItem("bt2_logs",JSON.stringify(logs));localStorage.setItem("bt2_checkins",JSON.stringify(checkins));localStorage.setItem("bt2_completed",JSON.stringify(completed))}
function setNav(id){document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));document.getElementById(id)?.classList.add("active")}
function dateKey(){return new Date().toISOString().slice(0,10)}
function key(day,i){return day+"_"+i}
function getSets(day,i,count){let k=key(day,i);if(!logs[k])logs[k]=Array.from({length:count},()=>({w:"",r:"",rir:"",done:false}));while(logs[k].length<count)logs[k].push({w:"",r:"",rir:"",done:false});return logs[k]}
function previous(day,i,name){let arr=[];Object.keys(logs).forEach(k=>{if(k!==key(day,i)){let idx=k.lastIndexOf("_");let d=k.slice(0,idx),j=+k.slice(idx+1);if(j===i && d!==day){logs[k].forEach(s=>{if(s.w&&s.r)arr.push(s)});}}});return arr.slice(-3)}

function workout(day){

 if(!p.exercises.length){home();return}

function exerciseCard(day,e,i){

  <div class="cue">${e.cue}</div><div class="muted" style="padding:0 15px 9px">${prevText}</div>
  <div class="sets"><div class="set-head"><span></span><span>LOAD</span><span>${e.unit==="sec"?"TIME":"REPS"}</span><span>RIR</span><span></span></div>
  ${sets.map((s,j)=>`<div class="set-row"><span class="setno">${j+1}</span><input inputmode="decimal" placeholder="${e.unit==="sec"?"sec":"lb"}" value="${s.w}" onchange="edit('${day}',${i},${j},'w',this.value)"><input inputmode="numeric" placeholder="${e.unit==="sec"?"sec":"reps"}" value="${s.r}" onchange="edit('${day}',${i},${j},'r',this.value)"><input inputmode="numeric" placeholder="1–3" value="${s.rir}" onchange="edit('${day}',${i},${j},'rir',this.value)"><button class="check ${s.done?"done":""}" onclick="toggleDone('${day}',${i},${j})">${s.done?"✓":"○"}</button></div>`).join("")}</div>

}
function recommend(e,sets){
 let filled=sets.filter(s=>s.w!==""&&s.r!=="");if(!filled.length)return"Next: enter your first working set. The app will use reps + RIR to guide progression.";
 let avg=filled.reduce((a,s)=>a+(+s.rir||0),0)/filled.length, allTop=filled.length>=e.sets&&filled.every(s=>+s.r>=e.max);
 if(allTop&&avg>=1)return"Next session: likely <b>increase load modestly</b> (typically 2.5–5 lb upper body, 5–10 lb lower body) and return toward the low end of the rep range.";
 if(avg<1)return"Next session: <b>hold or reduce load</b>. You're too close to failure for consistent progression.";
 return"Next session: <b>hold the load and add reps</b> where possible. Earn the increase by reaching the top of the range with good RIR.";
}

function edit(day,i,j,f,v){getSets(day,i,PROGRAM[day].exercises[i].sets)[j][f]=v;save()}

}

function progress(){
 setNav("nProgress");let last=checkins.at(-1);
 document.getElementById("app").innerHTML=`<div class="card"><div class="muted">BODY COMPOSITION</div><h2>Weekly check-in</h2><div class="formgrid"><div><label>Weight (lb)</label><input id="cw" inputmode="decimal" placeholder="e.g. 223" value="${last?.weight||""}"></div><div><label>Waist (in)</label><input id="cz" inputmode="decimal" placeholder="optional" value="${last?.waist||""}"></div><div style="grid-column:1/-1"><label>Recovery / soreness / hunger / hockey</label><textarea id="cn" placeholder="Anything that should influence training?">${last?.notes||""}</textarea></div></div><button class="primary" style="margin-top:10px" onclick="saveCheckin()">Save check-in</button></div>
 <div class="card"><h3>Recent check-ins</h3>${checkins.slice(-12).reverse().map(x=>`<div class="metric"><b>${x.date}</b> — ${x.weight||"—"} lb ${x.waist?"• "+x.waist+" in":""}<div class="muted">${x.notes||""}</div></div>`).join("")||"<div class='muted'>No check-ins yet.</div>"}</div>
 <div class="card"><h3>Strong historical record</h3><p class="small">${HISTORY.meta.rows.toLocaleString()} usable weighted set rows analyzed from ${HISTORY.meta.date_min} through ${HISTORY.meta.date_max}.</p>${Object.entries(HISTORY.exercises).map(([n,a])=>a.length?`<div class="metric"><b>${n}</b><div class="muted">${a.length} logged dates • latest ${a.at(-1).weight} × ${a.at(-1).reps}</div></div>`:"").join("")}</div>`;
}
function saveCheckin(){checkins.push({date:new Date().toLocaleDateString(),weight:document.getElementById("cw").value,waist:document.getElementById("cz").value,notes:document.getElementById("cn").value});save();progress()}
function coach(){
 setNav("nCoach");document.getElementById("app").innerHTML=`<div class="card"><div class="muted">ADAPTIVE TRAINING</div><h2>Coach</h2><div class="notice"><b>Core objective:</b> aggressive fat loss while preserving/building muscle, strength and athletic ability.</div>
 <h3>How progression works</h3><ul class="small"><li><b>1–3 RIR:</b> default working-set target.</li><li><b>Top of range + adequate RIR:</b> increase load modestly.</li><li><b>Mid-range:</b> hold load and add reps.</li><li><b>RIR 0 / repeated grinders:</b> hold or reduce load.</li><li><b>Poor recovery:</b> don't add volume just because the spreadsheet says so.</li></ul></div>
 <div class="card"><h3>Recovery guardrails</h3><p class="small">Monday is deliberately not a maximal lower-body day because persistent leg DOMS can interfere with Wednesday yoga. Saturday has leg volume, but the hinge work is optional when recovery is poor.</p><p class="small">Hockey can add fatigue, so the program should adapt rather than treating every week as identical.</p></div>
 <div class="card"><h3>Historical strength ≠ current target</h3><p class="small">Your old powerlifting-era squat/deadlift/bench PRs remain useful context, but they are not the loads the app should force you toward during the current transformation phase.</p></div>
 <div class="card"><h3>Nutrition</h3><p class="small">Use the nutrition plan as the fat-loss driver; training's job is to provide a strong muscle-retention signal. Weekly weight/waist trend and gym performance should determine whether the deficit is too aggressive.</p></div>`;
}
home();
</script>
<div style="text-align:center;color:#9aa0a8;font-size:9px;padding:0 0 10px">Body Transformation • V2 Gym UI</div></body>
